# $HOME/.ncmpcpp/viz.con

# You'll no doubt need to change this.
mpd_music_dir = "~/Music"

visualizer_data_source = "/tmp/mpd.fifo"
visualizer_output_name = "my_fifo"
visualizer_in_stereo = "yes"
visualizer_type = "ellipse"
visualizer_look = ▮▮
system_encoding = "UTF-8"

display_bitrate = no

header_window_color = "green"
volume_color = "magenta"
state_line_color = "green"
state_flags_color = "magenta"
main_window_color = "red"
color1 = "red"
color2 = "magenta"
main_window_highlight_color = "black"
progressbar_color = "cyan"
progressbar_elapsed_color = "black"
statusbar_color = "green"

# Bar
song_status_format = "{%a - }{%t - }{%b}"
progressbar_look = " "


# General
header_visibility = "no"
statusbar_visibility = "no"
